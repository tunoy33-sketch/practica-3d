<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidad 3: Primitivas 3D y Proyección</title>
    <!-- Vinculación del archivo de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor del Lienzo de Dibujo -->
    <div id="canvas-container">
        <canvas id="lienzo3D" width="600" height="500"></canvas>
    </div>

    <!-- Panel Lateral de Controles Interactivos -->
    <div class="panel">
        <h2>Unidad 3: Graficación 3D</h2>

        <!-- SELECCIÓN DE PRIMITIVA -->
        <h3>Figura 3D</h3>
        <div class="control-group">
            <label for="figura">Primitiva geométrica:</label>
            <select id="figura">
                <option value="piramide" selected>Opción A · Pirámide base cuadrada (5V, 8A)</option>
                <option value="prisma">Opción B · Prisma triangular (6V, 9A)</option>
                <option value="octaedro">Opción C · Octaedro (6V, 12A)</option>
                <option value="cubo">Cubo original (8V, 12A)</option>
            </select>
        </div>

        <!-- RETO: AUTO-ROTACIÓN -->
        <button id="btnAutoRotar" type="button">▶ Auto-rotación (Yaw)</button>
        
        <!-- 3.3.1 TRASLACIÓN -->
        <h3>3.3.1 Traslación (Tx, Ty, Tz)</h3>
        <div class="control-group">
            <label>Traslación X (Tx): <span id="valTx" class="val">0</span></label>
            <input type="range" id="tx" min="-200" max="200" value="0">
        </div>
        <div class="control-group">
            <label>Traslación Y (Ty): <span id="valTy" class="val">0</span></label>
            <input type="range" id="ty" min="-200" max="200" value="0">
        </div>
        <div class="control-group">
            <label>Traslación Z (Tz): <span id="valTz" class="val">0</span></label>
            <input type="range" id="tz" min="-200" max="200" value="0">
        </div>

        <!-- 3.3.2 ESCALAMIENTO -->
        <h3>3.3.2 Escalamiento (Sx, Sy, Sz)</h3>
        <div class="control-group">
            <label>Escala X (Sx): <span id="valSx" class="val">1.0</span></label>
            <input type="range" id="sx" min="0.2" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Escala Y (Sy): <span id="valSy" class="val">1.0</span></label>
            <input type="range" id="sy" min="0.2" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Escala Z (Sz): <span id="valSz" class="val">1.0</span></label>
            <input type="range" id="sz" min="0.2" max="3" step="0.1" value="1">
        </div>

        <!-- 3.3.3 ROTACIÓN -->
        <h3>3.3.3 Rotación (Rx, Ry, Rz)</h3>
        <div class="control-group">
            <label>Rotación X (Pitch): <span id="valRx" class="val">20°</span></label>
            <input type="range" id="rx" min="-180" max="180" value="20">
        </div>
        <div class="control-group">
            <label>Rotación Y (Yaw): <span id="valRy" class="val">30°</span></label>
            <input type="range" id="ry" min="-180" max="180" step="any" value="30">
        </div>
        <div class="control-group">
            <label>Rotación Z (Roll): <span id="valRz" class="val">0°</span></label>
            <input type="range" id="rz" min="-180" max="180" value="0">
        </div>

        <!-- 3.3.4 SESGADO -->
        <h3>3.3.4 Sesgado / Shear (Sh-XY, Sh-XZ)</h3>
        <div class="control-group">
            <label>Sesgado XY: <span id="valShXY" class="val">0.0</span></label>
            <input type="range" id="shxy" min="-1" max="1" step="0.1" value="0">
        </div>
        <div class="control-group">
            <label>Sesgado XZ: <span id="valShXZ" class="val">0.0</span></label>
            <input type="range" id="shxz" min="-1" max="1" step="0.1" value="0">
        </div>
    </div>

    <!-- Vinculación del script principal al final del body -->
    <script src="script.js"></script>
</body>
</html>
